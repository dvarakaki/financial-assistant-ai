<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="AssessorIA — assistente inteligente para finanças e agenda" />
  <title>AssessorIA — assistente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="console">

    <header class="console__header">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 2L11.8 8.2L18 10L11.8 11.8L10 18L8.2 11.8L2 10L8.2 8.2L10 2Z" fill="currentColor"/>
          </svg>
          <span class="header__dot" id="status-dot" aria-hidden="true"></span>
        </span>
        <h1 class="brand__title">assistente <span>/ chat</span></h1>
      </div>

      <div class="header__meta">
        <code class="header__session" id="session-id">—</code>
        <a class="nav-link" href="perfil.html">perfil</a>
        <a class="nav-link" href="monitor.html">monitor</a>
        <button class="header__reset" id="reset-session" type="button" title="Encerrar a sessão atual e começar uma nova">
          nova conversa
        </button>
      </div>
    </header>

    <main class="console__thread" id="thread" aria-live="polite">
      <div class="thread__empty" id="thread-empty">
        <div class="empty__icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 2L11.8 8.2L18 10L11.8 11.8L10 18L8.2 11.8L2 10L8.2 8.2L10 2Z" fill="currentColor"/>
          </svg>
        </div>
        <p class="empty__title">Como posso ajudar?</p>
        <p class="empty__text">Pergunte sobre gastos, saldo ou compromissos na agenda.</p>
      </div>
    </main>

    <form class="console__composer" id="composer" autocomplete="off">
      <textarea
        class="composer__input"
        id="pergunta"
        placeholder="Escreva uma mensagem…"
        rows="1"
        required
      ></textarea>
      <button type="submit" class="composer__send" id="enviar" aria-label="Enviar pergunta">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 12.5V3.5M8 3.5L4.2 7.3M8 3.5L11.8 7.3" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>

    <p class="console__hint" id="hint"></p>
    <p class="console__disclaimer">AssessorIA pode cometer erros. Confirme informações importantes antes de decidir.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
